worker_processes 1;
error_log stderr;
pid /tmp/nginx/nginx.pid;
daemon off;

events {
  worker_connections 768;
}

http {
  types_hash_max_size 2048;
  include mime.types;
  charset UTF-8;
  sendfile on;
  tcp_nopush on;

  client_body_temp_path /tmp/nginx/client_body;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types text/plain text/css text/xml application/xml application/xhtml+xml application/json application/javascript image/svg+xml application/rss+xml application/atom+xml;
  gzip_proxied any;
  gzip_vary on;

  # Canonical host for redirects. Never reflect an arbitrary `Host` header or it
  # becomes an open redirect. Point this at a different host if you deploy
  # preview/review apps (e.g. a Dokku review app) that share this config.
  map $host $canonical_host {
    default                 protos.inhouse.work;
    protos.inhouse.work     protos.inhouse.work;
    www.protos.inhouse.work protos.inhouse.work;
  }

  # Honour the scheme set by the TLS-terminating proxy in front of nginx so
  # redirects never downgrade an HTTPS request to HTTP.
  map $http_x_forwarded_proto $redirect_scheme {
    default $scheme;
    http    http;
    https   https;
  }

  server {
    listen 5000;
    server_name  _;
    root /usr/share/nginx/html;
    index index.html;
    port_in_redirect off;
    server_tokens off;
    access_log /dev/stdout;

    include /etc/nginx/security-headers.conf;
    error_page 404 /404.html;
    error_page 500 502 503 504 /500.html;

    # Canonical URLs: strip duplicate file extensions and trailing slashes in
    # a single hop. Redirect to the canonical host/scheme so we never reflect
    # `Host`.
    if ($uri ~ ^/index\.html/?$) {
      return 301 $redirect_scheme://$canonical_host/$is_args$args;
    }

    # Handles both `/foo.html` and `/foo.html/` in one redirect. 404/500 are
    # served internally and must be left alone.
    if ($uri ~ ^/(?!404\.html/?$|500\.html/?$)(.+)\.html/?$) {
      return 301 $redirect_scheme://$canonical_host/$1$is_args$args;
    }

    if ($uri ~ ^(.+?)/+$) {
      return 301 $redirect_scheme://$canonical_host$1$is_args$args;
    }

    location = / {
      try_files /index.html =404;
      expires 1h;
      gzip_static always;
    }

    # Never expose development assets, even if they leak into the image.
    # `^~` keeps the JS/CSS/image regex locations from serving them.
    location ^~ /vite-dev/ {
      include /etc/nginx/security-headers.conf;
      return 404;
    }

    # Error documents should never be cached or indexed. `internal` means a
    # direct hit returns a real 404 instead of a 200 soft 404.
    location = /404.html {
      internal;
      include /etc/nginx/security-headers.conf;
      add_header X-Robots-Tag "noindex" always;
      add_header Cache-Control "no-store" always;
    }

    location = /500.html {
      internal;
      include /etc/nginx/security-headers.conf;
      add_header X-Robots-Tag "noindex" always;
      add_header Cache-Control "no-store" always;
    }

    location / {
      include /etc/nginx/security-headers.conf;
      try_files $uri $uri.html =404;
      expires 1h;
      gzip_static always;
      add_header Vary Accept-Encoding;
    }

    location ~* \.(?:ico|gif|jpe?g|png|svg|webp)$ {
      include /etc/nginx/security-headers.conf;
      expires 31536000s;
      add_header Cache-Control "public, max-age=31536000, immutable";
      access_log off;
    }

    location ~* \.(css|js)$ {
      include /etc/nginx/security-headers.conf;
      expires 31536000s;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header Vary Accept-Encoding;
      charset utf-8;
      gzip_static always;
      access_log off;
    }

    location ~* \.woff2$ {
      include /etc/nginx/security-headers.conf;
      expires 31536000s;
      add_header Cache-Control "public, max-age=31536000, immutable";
      types { font/woff2 woff2; }
      gzip off;
      add_header Vary Accept-Encoding;
      access_log off;
    }

    location ~* \.webmanifest$ {
      include /etc/nginx/security-headers.conf;
      charset off;
      gzip off;
      access_log off;
    }

    location ~* \.gz$ {
      deny all;
    }
  }
}
